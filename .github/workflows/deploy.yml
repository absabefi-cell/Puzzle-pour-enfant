# Genere par Generateur universel APK
# Depot de reference : depot actuel | Branche de reference : main
# Place ce fichier dans .github/workflows/android.yml du depot de l'application.
name: "APK Puzzle_enfant"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    env:
      APP_NAME: "Puzzle_enfant"
      APP_ID: "com.absabefi.puzzleenfant"
      APP_VERSION: "1.0.0"
      APP_VERSION_CODE: "1000000"
      SOURCE_DIR: "."
      ICON_PATH: "puzzle enfant.jpg"
      XML_OPTIONS: "[\"<access origin=\\\"*\\\" />\",\"<allow-navigation href=\\\"https://*/*\\\" />\",\"<allow-navigation href=\\\"http://*/*\\\" />\"]"

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparer Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Installer Cordova et outil icones
        run: |
          npm install -g cordova@12 sharp-cli

      - name: Verifier les fichiers HTML
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/$SOURCE_DIR/index.html" || {
            echo "::error::index.html introuvable dans le dossier source : $SOURCE_DIR"
            exit 1
          }
          if [ -n "$ICON_PATH" ]; then
            test -f "$GITHUB_WORKSPACE/$ICON_PATH" || {
              echo "::error::Icone introuvable : $ICON_PATH"
              exit 1
            }
          fi

      - name: Preparer le projet Cordova
        shell: bash
        run: |
          set -euo pipefail
          cordova create /tmp/mon-apk "$APP_ID" "$APP_NAME"
          rm -rf /tmp/mon-apk/www
          mkdir -p /tmp/mon-apk/www
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='platforms' \
            --exclude='plugins' \
            --exclude='config.xml' \
            --exclude='package.json' \
            "$GITHUB_WORKSPACE/$SOURCE_DIR/" /tmp/mon-apk/www/
          test -f /tmp/mon-apk/www/index.html

          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/mon-apk/config.xml';
          let xml = fs.readFileSync(path, 'utf8');
          const escapeXml = s => s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
          xml = xml.replace(/(<widget\b[^>]*\bversion=")[^"]*(")/, (_,a,b) => a+escapeXml(process.env.APP_VERSION)+b);
          xml = xml.replace(/(<widget\b)/, (_,a) => a+' android-versionCode="'+process.env.APP_VERSION_CODE+'"');
          const options = JSON.parse(process.env.XML_OPTIONS);
          xml = xml.replace('</widget>', options.map(x=>'    '+x).join('\n')+'\n</widget>');
          fs.writeFileSync(path,xml);
          NODE

      - name: Configurer l'icone
        if: ${{ env.ICON_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/mon-apk/res
          sharp --input "$GITHUB_WORKSPACE/$ICON_PATH" --output /tmp/mon-apk/res/icon.png resize 1024 1024
          node - <<'NODE'
          const fs = require('fs');
          const path = '/tmp/mon-apk/config.xml';
          let xml = fs.readFileSync(path,'utf8');
          xml = xml.replace('</widget>','    <icon src="res/icon.png" />\n</widget>');
          fs.writeFileSync(path,xml);
          NODE

      - name: Ajouter Android
        working-directory: /tmp/mon-apk
        run: cordova platform add android@14

      - name: Installer les plugins selectionnes
        working-directory: /tmp/mon-apk
        shell: bash
        run: |
          set -euo pipefail
          echo "Aucun plugin supplementaire"

      - name: Compiler APK
        working-directory: /tmp/mon-apk
        run: cordova build android --debug

      - name: Sauvegarder APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-Android
          if-no-files-found: error
          path: /tmp/mon-apk/platforms/android/app/build/outputs/apk/debug/*.apk
